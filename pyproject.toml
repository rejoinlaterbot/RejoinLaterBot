[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rejoinlaterbot"
version = "0.1.0"
description = "Privacy-first Telegram group return scheduler"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RejoinLaterBot contributors" }]
dependencies = [
  "aiogram>=3.22,<4",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<51",
  "pydantic-settings>=2.10,<3",
  "regex>=2025.7.34",
  "sqlalchemy[asyncio]>=2.0.43,<3",
]

[project.urls]
Homepage = "https://github.com/rejoinlaterbot/RejoinLaterBot"
Repository = "https://github.com/rejoinlaterbot/RejoinLaterBot"
Issues = "https://github.com/rejoinlaterbot/RejoinLaterBot/issues"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
]

[project.scripts]
rejoinlaterbot = "rejoinlater.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rejoinlater"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires Docker and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"src/rejoinlater/domain.py" = ["S105"]
"src/rejoinlater/telegram/routers/start.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["rejoinlater"]

[[tool.mypy.overrides]]
module = ["regex"]
ignore_missing_imports = true
